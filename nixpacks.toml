[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "nodejs_20"]

[phases.install]
cmds = [
  "python3 -m pip install -r requirements.txt",
  "cd Public && npm install"
]

[phases.build]
cmds = ["cd Public && npm run build"]

[phases.start]
cmd = "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
